
version: '3.8'
services:
  app:
    build: .
    container_name: evershop-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: Adana01.
      DB_NAME: postgres
    depends_on:
      - database
    ports:
      - 3000:3000
    networks:
      - myevershop
 database:
    image: postgres:16
    container_name: evershop-database
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - myevershop

networks:
  myevershop:
    driver: bridge

volumes:
  postgres-data:
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  node_app:
    build: .
    container_name: node_app
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
volumes:
  mongo_data:
